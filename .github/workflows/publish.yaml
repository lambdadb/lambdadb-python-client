# Verify RC/stable versions committed on main, and publish release candidates
# and stable releases to PyPI from GitHub Releases using Trusted Publishing
# (OIDC). Every run also runs the deployed live smoke tests: development main
# pushes against the dev environment, release verification and Releases against
# production. Development builds use dev-package.yaml and are never published here.

name: Publish to PyPI

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event_name == 'push' && 'main' || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      smoke_prefix: ${{ steps.mode.outputs.smoke_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade packaging

      # A main push with the committed X.Y.Z.dev0 placeholder has nothing to
      # publish; a main push with an RC/stable version (a release PR merge) is
      # verified without publication; a GitHub Release publishes its version.
      # Development pushes are smoke-tested against the dev environment, release
      # verification and Releases against production.
      - name: Select the run mode
        id: mode
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(python scripts/version.py get)
          if [ "$PUBLISH_EVENT" != "push" ]; then
            MODE=release
          else
            case "$VERSION" in
              *.dev0) MODE=development ;;
              *.dev*) echo "Committed version $VERSION must use the .dev0 placeholder" >&2; exit 1 ;;
              *) MODE=verify ;;
            esac
          fi
          if [ "$MODE" = development ]; then SMOKE_PREFIX=LAMBDADB_DEV_; else SMOKE_PREFIX=LAMBDADB_PROD_; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "smoke_prefix=$SMOKE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "Committed version $VERSION; run mode $MODE; live smoke Variables $SMOKE_PREFIX*"

      - name: Validate committed release versions
        if: steps.mode.outputs.mode == 'verify'
        run: python scripts/validate_release_metadata.py --commit

      - name: Validate release tag and package versions
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: python scripts/validate_release_metadata.py

      - name: Verify release commit is on main
        if: steps.mode.outputs.mode != 'development'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

  test:
    needs: validate
    if: needs.validate.outputs.mode != 'development'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run non-integration tests
        run: python -m pytest tests/ -m "not integration" -v

      - name: Verify installed import
        run: |
          python -c "from lambdadb import LambdaDB, __version__; print(__version__)"

  build:
    needs: validate
    if: needs.validate.outputs.mode != 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from lambdadb import LambdaDB, __version__; print(__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-${{ github.event.release.tag_name || github.sha }}
          path: dist/
          if-no-files-found: error

  live-smoke:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      # A missing Variable stays empty and fails; it never falls back to the
      # other environment.
      - name: Authenticate smoke tests to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[format('{0}SMOKE_AWS_ROLE_ARN', needs.validate.outputs.smoke_prefix)] }}
          aws-region: ap-northeast-2
          role-session-name: python-sdk-smoke-${{ github.run_id }}

      - name: Run deployed live smoke tests
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', needs.validate.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', needs.validate.outputs.smoke_prefix)] }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars[format('{0}SMOKE_SECRET_ARN', needs.validate.outputs.smoke_prefix)] }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL"
          python scripts/run_live_smoke.py

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [validate, test, build, live-smoke]
    if: needs.validate.outputs.mode == 'release'
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists-${{ github.event.release.tag_name || github.sha }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
