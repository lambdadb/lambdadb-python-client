# Publish release candidates and stable releases to PyPI using Trusted
# Publishing (OIDC). Development builds use dev-package.yaml and never reach
# this workflow.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade packaging

      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          import re
          import runpy
          import tomllib
          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          release_is_prerelease = (
              os.environ["RELEASE_IS_PRERELEASE"].lower() == "true"
          )
          match = re.fullmatch(r"v(?P<version>.+)", tag)
          if not match:
              raise SystemExit(f"Release tag must look like v<version>, got: {tag}")

          tag_version_text = match.group("version")
          tag_version = Version(tag_version_text)
          if str(tag_version) != tag_version_text:
              raise SystemExit(
                  "Release tag must use canonical PEP 440 syntax: "
                  f"{tag_version_text!r} normalizes to {str(tag_version)!r}"
              )

          with open("pyproject.toml", "rb") as file:
              project_version_text = tomllib.load(file)["project"]["version"]
          runtime_version_text = runpy.run_path(
              "src/lambdadb/version.py"
          )["SDK_VERSION"]

          if (
              tag_version_text != project_version_text
              or tag_version_text != runtime_version_text
          ):
              raise SystemExit(
                  "Tag, project, and runtime versions must match: "
                  f"tag={tag_version_text!r}, "
                  f"project={project_version_text!r}, "
                  f"runtime={runtime_version_text!r}"
              )

          if tag_version.is_devrelease:
              raise SystemExit(
                  "Development releases must use dev-package.yaml and must not "
                  "be published to production PyPI"
              )

          if tag_version.is_prerelease:
              if tag_version.pre is None or tag_version.pre[0] != "rc":
                  raise SystemExit(
                      "Only release-candidate prereleases (X.Y.ZrcN) may be "
                      "published to production PyPI"
                  )

          if tag_version.is_prerelease != release_is_prerelease:
              raise SystemExit(
                  "GitHub prerelease flag does not match the package version: "
                  f"version={tag_version}, "
                  f"release.prerelease={release_is_prerelease}"
              )

          print(f"Validated release tag and versions: {tag}")
          PY

      - name: Verify release commit is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main --no-tags
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run non-integration tests
        run: python -m pytest tests/ -m "not integration" -v

      - name: Verify installed import
        run: |
          python -c "from lambdadb import LambdaDB, __version__; print(__version__)"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from lambdadb import LambdaDB, __version__; print(__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists-${{ github.event.release.tag_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
