
[project]
name = "lambdadb"
version = "0.9.0rc1"
description = "The Official LambdaDB Python SDK."
authors = [{ name = "Functional Systems, Inc." },]
readme = "README.md"
requires-python = ">=3.9.2,<3.14"
dependencies = [
    "httpcore >=1.0.9,<2",
    "httpx >=0.28.1,<1",
    "pydantic >=2.11.2,<3",
]

[tool.poetry]
homepage = "https://lambdadb.ai"
repository = "https://github.com/lambdadb/lambdadb-python-client.git"
documentation = "https://docs.lambdadb.ai"
packages = [
    { include = "lambdadb", from = "src" }
]
include = ["py.typed", "src/lambdadb/py.typed"]

[tool.setuptools.package-data]
"*" = ["py.typed", "src/lambdadb/py.typed"]

[virtualenvs]
in-project = true

[tool.poetry.group.dev.dependencies]
mypy = "==1.15.0"
pylint = "==3.2.3"
pyright = "==1.1.398"
pytest = [
    { version = ">=7,<9", python = "<3.10" },
    { version = ">=9.0.3", python = ">=3.10" },
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: optional live or third-party integration tests",
]

[tool.mypy]
disable_error_code = "misc"
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "typing_inspect"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonpath"
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
